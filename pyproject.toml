[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manga2motion"
version = "1.0.0"
description = "AI-Powered Manga-to-Video Diffusion System"
readme = "plan.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "diffusers>=0.28.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "safetensors>=0.4.2",
    "huggingface-hub>=0.22.0",
    "ultralytics>=8.1.0",
    "opencv-python>=4.8.0",
    "pillow>=10.2.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "einops>=0.7.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.4.9",
    "ffmpeg-python>=0.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "gradio>=4.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
]

[project.scripts]
manga2motion = "scripts.run_cli:main"
manga2motion-ui = "src.ui.app:main"

[tool.uv]
dev-dependencies = []
